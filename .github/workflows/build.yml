name: Build for Appetize Simulator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile for iOS Simulator
        run: |
          mkdir -p MathsApp9.app
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios15.0-simulator \
            -o MathsApp9.app/MathsApp9 \
            MathsApp9App.swift ContentView.swift MathEngine.swift

      - name: Zip Bundle Cleanly for Appetize
        run: |
          # This forces the zip file to map directly to the .app bundle structure
          zip -r MathsApp9_Simulator.zip MathsApp9.app

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appetize-Ready-Zip
          path: MathsApp9_Simulator.zip
